services:
  nginx:
    image: nginx:1.27-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-emby115-gateway}-nginx
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${GATEWAY_PORT:-8097}:8097"
      - "${ADMIN_PORT:-8098}:8098"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./web:/usr/share/emby115-web:ro
    depends_on:
      app:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gateway

  app:
    build:
      context: ./app
    image: ${COMPOSE_PROJECT_NAME:-emby115-gateway}-app:latest
    container_name: ${COMPOSE_PROJECT_NAME:-emby115-gateway}-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      APP_SECRET_KEY: ${APP_SECRET_KEY:-}
      ADMIN_INIT_USER: ${ADMIN_INIT_USER:-admin}
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD:-change-me-please}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      STRM_OUTPUT_DIR: /strm-output
    volumes:
      - ./data:/app/data
      - ${STRM_OUTPUT_HOST:-./strm-output}:/strm-output
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gateway
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

networks:
  gateway:

